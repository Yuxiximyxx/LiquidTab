name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.10-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.10-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.10
          name: LiquidTab 2.1.10（fork：掌盟活动页条身黑底改透明玻璃底色 + 定案日志）
          body: |
            ## LiquidTab 2.1.10（Yuxiximyxx fork）

            versionName 2.1.10 / versionCode 233。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.9 相同，
            可直接覆盖升级。本版**只动掌盟（qtl）**，修 2.1.9
            真机复验时活动页的条身黑底；小黑盒本版不碰。
            **均为代码层修复，未经真机验证**：

            ### 本轮定案（先取证再修）

            2.1.9 后商城槽位与药丸已正常，但「发现 → 活动」
            子页上整条仍是近不透明黑底。逐环核对代码 + 截图
            裁图取证，确定的结论：

            - 黑不在导航快照（artwork）链：本页截图里图标/
              文字/药丸都是逐叶快照的形态，逐叶快照已被正常
              提交；staged 校验拒收也只会保留上一张好快照，
              产生不了这块填满面板轮廓的黑。
            - 条身的黑来自宿主玻璃面板的实时背景场景：场景
              录制先铺一层底色、再回放页面内容的 RenderNode，
              底色在夜间解析为不透明黑（逐层找不透明背景、
              最后落纯黑）。该子页上场景内容覆盖不到条身
              下部——裁图实证：条身上部约 1/3 有紧邻上方卡片
              的折射内容，下部约 2/3 是与身后图文无关的平
              黑——覆盖不到的区域就只剩不透明底色 + 半透明
              填充，即近不透明黑。
            - 待日志证实的只剩一环：该页内容为何覆盖不到
              （疑为合成层回放不可靠的页面构成）。本版新增
              的 backdrop 状态日志带 WebView 探查位，真机
              复现时导 LSPosed 日志即可定案。

            ### 本版修法（只动 qtl）

            1. 条身改透明玻璃底色：掌盟适配主动供给背景场景
               （宿主父层下包含导航源的应用根布局，采样集合
               与默认一致），场景底色随即改走全透明口径，不
               再用不透明黑。场景内容覆盖不到条身时，条身保
               持透明玻璃（只画图标文字 + 半透明填充），最坏
               情况也只是清玻璃，永不落回不透明黑。
            2. 补定案日志（前缀 [OfflineGlass][QTL]）：
               「snapshot commit」逐次记录快照提交分类
               （committed-leaf / committed-generic /
               rejected-opaque / empty-fallback，含不透明
               占比与页面上下文）；「backdrop」在背景状态
               变化时记录 live/displayList/scene/webView。
               真机若仍黑，看这两行在黑底时段的取值定案。

            ### 复验要点

            - 掌盟强停重开：切到「发现 → 活动」子页，底栏
              应为真玻璃（身后内容透得过来），不再整条黑
              底；首页、商城等其它页面表现不应回退（内容
              铺底、切换流畅、高亮对位、药丸颜色一致）。
            - 若活动页仍黑：请导出 LSPosed 日志发回，日志
              里 [OfflineGlass][QTL] 的 snapshot commit 与
              backdrop 两行就是定案依据。
            - 小黑盒本版未动，无需复验。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
