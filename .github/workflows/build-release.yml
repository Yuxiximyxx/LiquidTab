name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.12-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.12-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.12
          name: LiquidTab 2.1.12（fork：掌盟黑底二轮日志定案——自愈换自驱恢复泵）
          body: |
            ## LiquidTab 2.1.12（Yuxiximyxx fork）

            versionName 2.1.12 / versionCode 235。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.11 相同，
            可直接覆盖升级。本版**只动掌盟（qtl）**，按 2.1.11
            的真机日志复盘换恢复机制；小黑盒本版不碰。
            **均为代码层修复，未经真机验证**：

            ### 日志复盘（2.1.11 两段会话）

            - `snapshot commit` 两段恒 `committed-leaf`
              （会话 B 一次 `rejected-opaque` 是通用兜底被
              拒、逐叶图保留），artwork 链健康，黑与快照
              无关。
            - 会话 A（23:57:01 起）：`23:57:05.458` 翻为
              `live=true displayList=false` 后，直到进程
              重启（23:59:07）再无任何 backdrop 行、
              `repairs=0`——2.1.11 修复的触发点只在
              pre-draw 跑，静态页帧泵枯竭，修复根本没触
              发；黑底截图（23:59:00）正落在此区间。
            - 会话 B（23:59:07 起）：`23:59:43.775` 翻
              转，`23:59:44.190 repairs=1`（一次性修复触
              发过一次），此后直到导出（00:01:42）无
              `displayList=true` 恢复行、repairs 不再涨
              ——单次 invalidate+标脏只保证一帧遍历，而
              该帧 pre-draw 清扫跑在场景视图 draw 阶段重
              录自身 list 之前仍扑空，之后无帧、无从重试。

            ### 本版修法（只动 qtl，换恢复机制）

            自愈改为**自驱恢复泵**，不依赖环境帧：
            onHostFrame 首次观察到退化即 arm 一个 Handler
            投递的 400ms 启动器（与帧无关），到期直接读
            宿主状态确认仍退化才开泵；泵每 300ms 一轮
            （场景视图 invalidate + 标脏刷新逼遍历）——
            第 N 轮遍历在 draw 阶段重录场景自身 list，
            第 N+1 轮的 pre-draw 清扫即可命中并重录包
            装节点。泵自查恢复即停，单集预算 12 轮，耗
            尽落闩、本集不再重启；每轮 `repairs++`，且
            backdrop 日志改为 repairs 变化也打行，泵的
            工作过程在日志里全程可见。已验好的部分
            （首页/商城呈现、点击对位、选中映射、评论
            贴合）一律未动。

            ### 复验要点

            - 掌盟强停重开：停在首页与「发现 → 活动」子页
              各看底栏——应为真玻璃、身后内容透得过来，不
              再整条黑底；**这次请在黑底出现后原地停留十
              几秒不操作**，恢复泵不依赖滑动出帧，停住也
              应自行恢复。
            - 若仍黑：请再导出一次 LSPosed 日志发回，看
              [OfflineGlass][QTL] backdrop 行里 repairs
              是否涨到 12（泵跑满）、其后有没有
              displayList=true 恢复行——涨满仍不恢复说明
              断点另有其环；repairs 恒 0 说明 arm 都没成
              立，同样可据此定案。
            - 小黑盒本版未动，无需复验。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
