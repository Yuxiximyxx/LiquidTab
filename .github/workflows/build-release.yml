name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.15-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.15-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.15
          name: LiquidTab 2.1.15（fork：掌盟平白定案——自采背景经 videoBackdrop 供给）
          body: |
            ## LiquidTab 2.1.15（Yuxiximyxx fork）

            versionName 2.1.15 / versionCode 238。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.14 相同，
            可直接覆盖升级。本版**只动掌盟（qtl）**；小黑盒
            本版不碰。**均为代码层修复，未经真机验证**：

            ### 2.1.14 真机复验定案（日志 + 截图像素）

            - 【实证-日志】2.1.14 的宿主软件捕获链是通的：
              backdrop 行 mode=software、samplePending
              true→false 落账、snapshot commit 恒
              committed-leaf（artwork 健康）；且宿主捕获
              idle 间隔为 0、每个 pre-draw 都在重捕，不是
              只采了一张旧图。
            - 【实证-像素】失败形态由黑变平白：截图条内全条
              均匀 (247,247,247)；条上方紧邻的 feed 卡片
              深色多彩、底边距条顶约 20px，整段落在捕获
              padding 带与折射可达范围内，条内却零色调。
              故平白来自位图内容本身——位图里没有页面
              内容，条身只剩浅色主题近白的 surface 填充。
            - 【推断】宿主 captureBackdrop 在 pre-draw 时机
              对父层 root.draw()：该帧内容尚未绘制、且
              dirty-opaque 的视图会跳过自身绘制，捕获到的
              只有背景层；美团软件路径的源是 WebView（软
              件绘制必出内容），与掌盟原生树不同。此点为
              机制推断（宿主位图内容无日志可见）。

            ### 本版修法（只动 qtl）

            - 改**自采背景**：不再依赖宿主的 pre-draw 捕获。
              导航状态在待采/场景脏时，经 host.post 把捕获
              排到本帧遍历完成之后（稳态、脏标记已清），把
              场景（qt_content）以全窗几何、1/2 缩放软件
              绘制进自有位图。
            - 自采位图经 **videoBackdrop()** 通道供给：该
              通道在宿主 drawBackdropContent 中优先级最
              高，按窗口几何把位图裁回条身后方；每次捕获
              epoch 递增并刷新宿主。宿主软件路径保留作自
              采首图就绪前的兜底。
            - 新增位图内容探针日志（self backdrop 行：不透
              明占比 + 顶部/中部色带均值），下一轮导日志
              即可直接判定自采位图有没有内容。
            - skipLiveBackdrop 恒 true 不变；已验好的点击
              对位、选中映射、内容铺底、商城槽位、发布圆
              钮一律未动。

            ### 复验要点

            - 掌盟强停重开：首页与「发现 → 活动」子页各停
              留观察——底栏应是有内容的玻璃（能透出条身
              后方的 feed 内容），不再整条平白或黑底；切
              tab 流畅、高亮对位、药丸颜色一致不回退。
            - 若仍平白：请再导出一次 LSPosed 日志发回，看
              [OfflineGlass][QTL] self backdrop 行的
              opaque 与 topRGB/midRGB 继续定案。
            - 小黑盒本版未动，无需复验。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
