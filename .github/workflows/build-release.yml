name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.5-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.5-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.5
          name: LiquidTab 2.1.5（fork：掌盟界面恢复 + 小黑盒发布键图标与沉浸）
          body: |
            ## LiquidTab 2.1.5（Yuxiximyxx fork）

            versionName 2.1.5 / versionCode 228。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.4 相同，
            可直接覆盖升级。本版修 2.1.4 真机复验的三项问题，
            **均为代码层修复，未经真机验证**：

            ### 1. 掌盟界面恢复（2.1.4 回归，优先项）

            根因：2.1.4 的 QtlAdapter 往上三层找「含加号按钮的
            容器」作导航源，在 12.10.0 上命中的是页面级大容器；
            共享管线会把源 alpha 置 0 并按源宽等分切片投影，
            于是整页被隐藏、槽位里画的是整页微缩图（与真机
            截图一致）。

            修法：
            - 源严格限制为底栏壳层：候选祖先必须高度 ≤168dp
              且底边与文字行底边对齐（≤12dp），选不到就退回
              文字行本身；
            - acceptsNavigationSource 增加高度兜底（>200dp
              直接拒绝），任何发现路径都选不出页面级容器；
            - 不再放开内容区 RelativeLayout ABOVE 规则、不再
              清祖先链背景；去黑带只清底栏装配自身底色加安装
              器对直接父壳层的通用处理。**若真机上黑带仍有
              残留，是为保界面完整的主动取舍，后续再议；**
            - artwork 改逐 tab 叶子捕获：每个 tab 只取内部
              真实图标（ImageView / 顶部 compound drawable）
              与文字，加号槽画原生按钮本体，不再用容器切片。

            把握程度：根因链（选源过大 → alpha 置 0 → 整页
            隐藏；等分切片 → 微缩图入槽）已在共享管线代码中
            逐环坐实，修复针对每一环，界面恢复的把握较大；
            但宿主 12.10.0 的真实层级未经真机探针，最终以
            真机为准。

            ### 2. 小黑盒发布按钮补图标

            根因：通用绘制路径从不往独立圆钮里画 artwork
            （四个页面槽之外，发布槽不在绘制列表内；xhs/贴吧
            均由适配器自绘发布键）。

            修法：HeyboxAdapter 自持绘制
            （ownsNavigationDrawing），通用投影之后把
            vg_mid_tab 内部的图标叶子（ImageView）画进圆钮；
            取不到图标时手绘加号兜底，圆钮不再空白。快照
            同步改逐槽叶子捕获：普通槽取 RadioButton 顶部
            compound drawable + 文本（与 BetterHeybox 构建
            底栏的取图方式一致），中间槽取 vg_mid_tab 图标
            叶子。

            ### 3. 小黑盒导航条沉浸

            共享安装器只做到窗口标志与导航条颜色透明，宿主
            根布局仍按 navigationBars inset 留底，玻璃条下
            留实色带。本版在适配器 configureNavigationInsets
            中（照本仓 CainiaoInsets 成法）对含 rg_main 的
            主界面窗口把导航条底部 inset 清零，内容铺到物理
            底部；其它页面不做，避免破坏依赖该 inset 的布局
            （与 BetterHeybox 只在主界面全量沉浸的口径一致）。

            ### 附带核对：小黑盒四个 tab 的几何形图标

            2.1.4 截图中四槽图标为三角/圆/叉/方块。本版捕获
            已改为直接取 RadioButton 的顶部 compound
            drawable——宿主真图标的权威来源，BetterHeybox
            同款取法。若装 2.1.5 后仍是几何形，则说明宿主
            当前下发的 compound drawable 本身即为该组图形
            （图标由服务端热更新下发，未到达或回退默认时
            可能如此），下一步需在真机上关模块作用域、同屏
            对照原生底栏确认，不要再从模块侧猜。

            ### 复验方法

            - 掌盟：强停重开，首页内容应完整显示，玻璃条浮
              在底部、图标为各 tab 真图标；发布键圆钮内应有
              原生加号按钮。
            - 小黑盒：强停重开，玻璃条下方不应再有实色带、
              内容应铺到屏幕底部；独立发布键圆钮内应有发布
              图标；四槽图标对照原生底栏看是否一致。
            - 微信：2.1.4 的聊天页修复未动，进聊天页确认
              底部高度无回归。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
