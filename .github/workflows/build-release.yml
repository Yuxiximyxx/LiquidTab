name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.3-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.3-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.3
          name: LiquidTab 2.1.3（fork：基线纠正至上游 2.1.2 + 掌盟/小黑盒适配）
          body: |
            ## LiquidTab 2.1.3（Yuxiximyxx fork）

            versionName 2.1.3 / versionCode 226。

            ### 基线纠正

            此前 fork 误以 upstream 的 main 分支为基线，而上游 main
            停在 2.0 源码投放；上游正式发布 v2.1.0 / v2.1.2 的源码
            只在 tag 上。本版起改以 **upstream tag v2.1.2**
            （versionCode 225）为基线重建，2.0.x 旧线保留在
            fork-2.0-line 分支。2.1.2 相对 2.0 的主要变化：改用
            libxposed 现代入口（META-INF/xposed）并保留兼容层、
            新增 detachedPublish（发布按钮独立）等配置项、适配
            应用扩充（新增 Spotify、Apple Music、TikTok、
            ChatGPT、Instagram、X、Reddit、Quora、华为运动健康等）。

            ### 本版改动

            - **移植掌上英雄联盟（com.tencent.qt.qtl）适配**：
              纯配置接入（adapters/qtl，GENERIC_FALLBACK），与
              2.0.1 版口径一致；发现信号来自 PalmPurify 的定位
              成果（首页 GameHomeActivity、tab_title_content、
              bottom_title_center_btn、5 槽位）。
            - **移植小黑盒（com.max.xiaoheihe）适配**：纯配置
              接入（adapters/heybox，GENERIC_FALLBACK），与
              2.0.2 版口径一致；发现信号来自 BetterHeybox
              （主页 MainActivity、rg_main、vg_mid_tab、5 槽位），
              只移植发现信号与页面政策，未搬其玻璃绘制代码。
            - TargetSpecRegistry、AppCatalog 与两份 scope
              （assets/xposed_scope 与 META-INF/xposed/scope.list）
              已同步，正式适配应用 33 → 35 个。

            ### 已知问题（本版未处理，待用后定）

            掌盟与小黑盒在 2.0.x 上真机初验发现的四项问题本版
            **未做修复**，在新基线上表现待复验：

            1. 玻璃条后面仍有宿主底栏的黑色背景；
            2. 按钮图标/位置偏移（中间发布按钮尤甚）；
            3. 发布按钮尚未按新基线的 detachedPublish 政策
               独立成圆形按钮；
            4. 设置页尚不能按应用选择显示哪些底栏按钮
               （两应用无入口开关）。

            ### 注意

            - **冲突提醒**：启用 LiquidTab 的小黑盒玻璃后，
              请关掉 BetterHeybox（独立版或荣耀工具箱内
              「小黑盒增强」）自带的液态玻璃底栏开关，避免
              同一底栏被处理两次。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖
              安装；证书与 fork 2.0.1 / 2.0.2 相同，可直接
              覆盖升级。
            - 验法：LSPosed 作用域勾选掌上英雄联盟 / 小黑盒，
              强停重开对应应用，看底栏是否变为悬浮玻璃条。
          files: dist/*.apk
