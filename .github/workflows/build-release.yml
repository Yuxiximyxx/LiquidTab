name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.7-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.7-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.7
          name: LiquidTab 2.1.7（fork：掌盟去主题带+选中定版，小黑盒间隙断开+评论输入框贴合恢复）
          body: |
            ## LiquidTab 2.1.7（Yuxiximyxx fork）

            versionName 2.1.7 / versionCode 230。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.6 相同，
            可直接覆盖升级。本版修 2.1.6 真机复验的四项问题，
            **均为代码层修复，未经真机验证**：

            ### 1. 掌盟：玻璃条后面还有一条背景带

            定性（真机补充确认）：这条带子浅色模式下是白色、
            夜间是黑色，随主题变色——是宿主原底栏容器自己的
            背景，不是某个黑色物件。它是全宽容器，玻璃条比它
            窄、位置偏高，背景就从玻璃条右后方露出来（间隙里
            的「白色连接」也是它）。安装器的通用逻辑只清导航
            源的直接父层（≤196dp），这层容器在更外层，一直
            漏网。本版在 suppress 时从源逐层向上（至多 3 层）
            只清同时满足「底边与文字行底边对齐 ≤20dp、高度
            ≤260dp、宽度不小于文字行」的祖先——即底栏容器
            本身；任一层不合格立即停，页面级容器绝不会被清
            到。只清背景，不动任何布局与选源。

            ### 2. 掌盟：选中高亮漂移 + 后两 tab 切换卡顿

            切到「我的」后高亮自己滑到「商城」：宿主的通用
            选中判定按「容器第 i 个子视图」打分，文字行里
            只有四个页面 tab（加号不在行内），第 4 个 tab
            （我的，子下标 3）被直接当作槽位 3（商城），
            第 3 个 tab（商城，子下标 2）又与发布槽同号被
            跳过。本版给掌盟实现 resolveSelectedIndex：按与
            捕获/点按相同的口径枚举四个 tab，逐个查子树里的
            真实选中信号（isSelected / isActivated /
            drawable 的 state_selected），再映射回槽位序号
            （发布槽之后 +1），选中以宿主真实状态为准。
            卡顿：点按递进新增一级快路径——合成触摸只分发
            给文字行（目标的父容器），由宿主自己的命中分发
            决定落点；后两槽不再走全窗根分发与 200 视图
            DFS 两条慢路径。判定不再反复纠正，切换动画也
            不再二次回弹。

            ### 3. 主条与发布圆钮之间还有连接（掌盟 + 小黑盒）

            两边分别处理，目标与小红书口径一致：主条与圆钮
            完全分离、间隙里是真实内容。
            - 掌盟：barLayout 摘掉本地光学三标志
              （localMainOptics / localActionOptics /
              actionFillUsesOnlySurfaceOpacity），字段集与
              xhs 对齐——本地光学的采样节点按 padded 区域
              录制，曾在圆钮外多出一圈大号浅色底板；再加上
              第 1 项清掉容器背景，间隙不再被主题条带垫底。
            - 小黑盒：stripChrome 的兄弟薄层清理从「与
              rg_main 矩形相交」放宽到整条底栏带（左右到根
              布局两边、向下到根布局底边，高度上限 3 倍栏
              高），并新增与掌盟同口径的底栏容器背景清理
              （从 rg_main 向上至多 3 层，几何守卫相同）：
              原底栏背景条若只挂在底栏下方或间隙正后方，
              旧判定够不着，正是它把主条与圆钮连成一片。

            ### 4. 小黑盒：评论页输入框与键盘不协调（恢复旧修复）

            这是 BetterHeybox 时代的 fork 定制
            CommentInputDockHook（d713f09 引入，5858c1f
            定版为「只铺背景」），工具箱 v1.10.0 摘除小黑盒
            底栏功能时被连带丢失，本版按原行为移植进 heybox
            适配（只搬行为，不搬其玻璃绘制）：小黑盒评论页
            的回复输入框是悬浮圆角卡片，键盘弹起时浮在键盘
            上方、与面板割裂。修复挂 Activity.onResume，给
            每个 Activity 的 decor 注册全局布局监听；键盘
            高度超过屏高 15% 且页面里有评论输入框（hint 含
            「来说点什么」）时，找到输入框的卡片容器（首个
            带背景的祖先），取它的底色，给卡片外层至多两层
            非全屏容器铺同一颜色，让输入区沉进整块面板、
            与键盘连成一体。不动任何布局参数（早期清边距
            的做法会把输入文字顶到贴边裁切，早已废弃）。

            ### 复验要点

            - 掌盟强停重开：浅色与夜间各看一次，玻璃条后方
              与间隙里不再有主题色带；逐个点首页/好友/商城/
              我的，页面与高亮逐一对应（尤其「我的」高亮
              不再滑到商城），后两 tab 切换不再卡顿；中间
              发布键点按有反应。
            - 小黑盒强停重开：主条与发布圆钮完全分离、
              间隙干净；进帖子点评论拉起键盘，输入框应与
              键盘面板连成整块、无异色带与割裂感。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
