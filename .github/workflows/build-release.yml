name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.13-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.13-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.13
          name: LiquidTab 2.1.13（fork：掌盟黑底三轮定案——实时场景恢复改结构性兜底）
          body: |
            ## LiquidTab 2.1.13（Yuxiximyxx fork）

            versionName 2.1.13 / versionCode 236。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.12 相同，
            可直接覆盖升级。本版**只动掌盟（qtl）**，按 2.1.12
            的真机日志定案改结构性兜底；小黑盒本版不碰。
            **均为代码层修复，未经真机验证**：

            ### 日志定案（2.1.12 会话，00:33:54 起）

            - `snapshot commit` 恒 `committed-leaf`
              （一次 `rejected-opaque` 是通用兜底被拒、逐叶图
              保留），artwork 链健康；`scene=true`、
              `webView=false` 与前两段会话一致。
            - `00:34:31.268 live=true displayList=false repairs=0`
              翻转；`00:34:31.748 repairs=1`——恢复泵的启动器
              与第 1 轮确实跑了（+480ms，与 400ms 驻留吻合）。
            - 此后直到导出（00:34:39）再无任何 backdrop 行：
              没有 `displayList=true` 恢复行，repairs 也不再
              有被记录的增长；小乐原话「等了好久还是没变」。
            - 结论：invalidate + 标脏这条恢复路（2.1.11 一次
              性版、2.1.12 自驱泵版）连败两版——能启动，却始
              终没能让包装节点把 display list 录回来。本版不
              再做第三次同思路重试。

            ### 本版修法（只动 qtl，换结构性兜底）

            退化坐实后不再死等实时场景，改走宿主自带的软件
            快照背景（美团外卖 WebView 页在宿主清扫内的同款
            落点）：

            - 退化签名（live=true 而 displayList=false）出现
              后 400ms，由 Handler 投递的确认直接读宿主状态
              （不依赖帧）：包装节点已自行恢复、或宿主的软件
              快照已被帧流带起来时，什么都不做；两者皆无——
              条身正卡在只剩填充的黑底状态且没有帧会来救它
              ——才落闩。
            - 落闩后 skipLiveBackdrop 恒真：宿主放行实时场
              景，pre-draw 转入软件快照路径，以适配器供给的
              场景为源把条身后方内容画进 backdrop 位图；
              hasUsableBackdrop 经位图条款恒真，玻璃着色器
              照常工作。落闩后逼出一帧完成首次捕获；静态页
              内容不变，位图即正确像素，不需要后续帧维持。
            - 必然性：黑底的充要条件是 hasUsableBackdrop 为
              假（只剩填充）。落闩后条身背景与那只丢失的
              display list 彻底脱钩——位图由软件绘制当场生
              成，不存在「丢了且无人重录」的中间态。代价仅
              是玻璃退化为静态快照背景（滚动时随帧流刷新）。
            - 切 tab（新页面场景重建）时解闩，实时场景重新
              试一次；再退化会重新落闩。恢复泵整套移除。
            - backdrop 日志新增 fallback/episodes 两位，落
              闩与解闩各有专行（`backdrop fallback: ...`）。

            ### 复验要点

            - 掌盟强停重开：停在首页与「发现 → 活动」子页
              各看底栏——黑底出现后**原地停留不操作**，预期
              约 1 秒内条身自行变为有内容的玻璃（落闩后是
              静态快照背景，质感略降于实时玻璃，但绝不再是
              不透明黑）；切 tab 后实时玻璃应恢复。
            - 若仍黑：请再导出一次 LSPosed 日志发回，看
              [OfflineGlass][QTL] 有没有 `backdrop fallback:
              ... latched` 行——有落闩行而条仍黑，断点在软
              件快照路径本身；没有落闩行，看 backdrop 行的
              fallback/episodes 取值继续定案。
            - 小黑盒本版未动，无需复验。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
