name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.9-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.9-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.9
          name: LiquidTab 2.1.9（fork：掌盟商城页快照落兜底致黑底蓝椭圆，三层堵死）
          body: |
            ## LiquidTab 2.1.9（Yuxiximyxx fork）

            versionName 2.1.9 / versionCode 232。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.8 相同，
            可直接覆盖升级。本版**只动掌盟（qtl）**，修 2.1.8
            真机复验时商城页的问题；小黑盒已经小乐确认修完，
            本版不碰。**均为代码层修复，未经真机验证**：

            ### 问题定案（截图逐像素核对）

            2.1.8 在首页已好（内容铺底、切换不卡），但切到商城页
            后：整条变不透明黑底；「商城」槽位画出一个占满槽位
            的纯平蓝椭圆、商城文字消失；其余槽位图标文字发暗；
            选中药丸的颜色也跟着变了。逐像素核对的结论：

            - 蓝形的尺寸与首页选中药丸逐像素相同（151×120px），
              但它不是药丸被染蓝——商城页那张导航快照根本不是
              逐叶捕获的产物，而是宿主通用兜底对源的整树绘制：
              黑底是一块带方形直角的矩形，内嵌在圆角玻璃面板
              轮廓之内，正是位图矩形的边缘；逐叶捕获先把目标
              清成全透明再逐叶绘制，画不出整幅黑底，只有通用
              兜底（逐叶捕获返回 false 时宿主走 source.draw()）
              能产生这种位图。
            - 商城页的真实构成：底栏源与首页是同一行、同一
              层级（商城是 GameHomeActivity 内的页签页，顶部的
              区服/签到/商城-活动-通行证是该页内容结构）；不同
              的是商城单元在软件绘制下拿不到图标叶子与文字——
              它只剩选中态的椭圆背景视图。旧捕获按「带文字」
              过滤行子视图会把这个无文字单元整个排除、tab 数
              凑不齐四，或因「任一 tab 素材全空」整次失败，
              随即落到通用兜底：黑底是宿主原底栏底色，蓝椭圆
              就是那个单元在兜底位图里的样子，其余槽位是原生
              未选中态的灰图标，所以发暗。
            - 药丸变色是同一个根：药丸透镜采样了这张兜底位图
              里商城槽位的蓝椭圆，于是看起来药丸变蓝了。模块
              自身的药丸填充口径（静置填充为黑/白低透明）从未
              按页面采样改色，本版也不让它改：堵住兜底位图，
              药丸颜色在各页自然一致。

            ### 本版三层修（只动 qtl）

            1. 捕获加固：行枚举改按行子视图普查（非 GONE 孩子
               四个即全是 tab；五个时中间的发布占位按「是/含
               加号按钮或无文字」剔除），选中兜底与点按兜底
               同步同口径；单个 tab 素材全空只让该槽在本张
               快照留空，不再整次失败；图标叶子提取跳过填满
               单元的背景型 ImageView（选中态椭圆指示），图标
               布局与绘制尺寸钳制到 32dp 内，异常大叶子再也
               顶不掉文字、占不满槽位。普查异常带节流日志
               （[OfflineGlass][QTL] capture census），若真机
               仍有问题可据 LSPosed 日志核对命中情况。
            2. 普查不完整时推迟捕获：已有好快照时，若当前行
               普查发现某个 tab 单元既无图标叶子也无文字，
               本次捕获推迟 300ms 并保留上一张完整快照——
               商城页继续显示首页捕获到的正常商城图标文字，
               药丸位置由选中判定独立跟随；行结构恢复完整后
               签名机制自然重捕获。尚无快照时不推迟，首捕获
               先行。
            3. staged 捕获 + 提交前校验：qtl 开启
               stagedNavigationSnapshot，快照先画进暂存位图；
               提交前按不透明占比校验——逐叶捕获的位图只有
               图标/文字/加号本体、大面积透明（约三成以内），
               通用兜底位图几乎全不透明，占比超 45% 直接拒收
               并记节流日志，黑底位图永远上不了屏，在屏的
               上一张好快照保持不变。

            ### 复验要点

            - 掌盟强停重开：首页应与 2.1.8 一致（内容铺底、
              切换流畅）；切到商城页，底栏应恢复玻璃（不再
              整条黑底），「商城」槽位应是正常图标+文字，
              不再是蓝椭圆；首页↔商城来回切，选中药丸颜色
              应保持一致、不随页面变化；四个 tab 的页面与
              高亮逐一对应、发布键点按有反应。
            - 小黑盒本版未动，无需复验（若顺手打开应与
              2.1.8 表现一致）。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
