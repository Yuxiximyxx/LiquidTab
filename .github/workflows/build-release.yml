name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.11-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.11-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.11
          name: LiquidTab 2.1.11（fork：掌盟黑底日志定案——实时场景丢失后加自愈重录）
          body: |
            ## LiquidTab 2.1.11（Yuxiximyxx fork）

            versionName 2.1.11 / versionCode 234。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.10 相同，
            可直接覆盖升级。本版**只动掌盟（qtl）**，按 2.1.10
            导出的 LSPosed 日志定案修黑底；小黑盒本版不碰。
            **均为代码层修复，未经真机验证**：

            ### 日志定案（2.1.10 两段会话，同形态）

            - artwork 链健康：`snapshot commit` 恒为
              `result=committed-leaf opaque=0.111 sel=0
              everCommitted=true`，逐叶快照正常提交，黑不在
              快照链。
            - 场景供给命中：`backdrop` 行 `scene=true`；
              `webView=false`（活动页合成层构成的猜测未获
              日志支持）。
            - 断点在实时场景：每次冷启约 8 秒后状态翻为
              `live=true displayList=false scene=true` 且不再
              恢复——实时场景包装节点的 display list 丢失，
              `hasUsableBackdrop()` 恒 false，条身只剩
              surface 填充，夜间即近不透明黑。模块内三处
              discardDisplayList 均同时清 live 或为其他包/
              适配专用，无一能产生该状态；且宿主在场景视图
              自身节点无 list 且未 dirty 时清扫恒空转、永不
              重录——丢失属框架层、宿主无自愈（原生触发点
              日志不可见，不冒充定案）。
            - 同包无 qtl 崩溃/异常、无 census 失败；CfgDiag
              约 1 秒一次的后台配置轮询为全天恒在的既有
              行为，未见卡顿复发迹象。

            ### 本版修法（只动 qtl，只补自愈一环）

            `onHostFrame` 检测到 `live && !displayList` 退化
            状态持续超过 400ms 后，以 1.5 秒节流自愈：把
            场景视图 `invalidate()`（逼框架在下一次遍历重
            录它的 display list，打破「节点无 list + 视图
            未 dirty」的死锁），并调宿主现成的
            `adapterScheduleBackdropRefresh` 把场景签名标
            脏，迫使宿主在后续帧重录包装节点。`backdrop`
            日志加 `repairs=` 计数：恢复后会打出
            `displayList=true` 且带 repairs 计数，下次导
            出即可验证自愈链是否闭合。已验好的部分（首
            页/商城呈现、点击对位、选中映射、评论贴合）
            一律未动。

            ### 复验要点

            - 掌盟强停重开：停在首页与「发现 → 活动」子页
              各看底栏——应为真玻璃、身后内容透得过来，不
              再整条黑底；切换流畅、高亮对位、药丸颜色
              一致不应回退。
            - 若仍黑：请再导出一次 LSPosed 日志发回，看
              [OfflineGlass][QTL] backdrop 行里 repairs=
              是否增长、其后有没有 displayList=true 的恢
              复行，即可判定自愈是否触发、断点是否另有
              其环。
            - 小黑盒本版未动，无需复验。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
