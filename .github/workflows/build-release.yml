name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.0.2-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.0.2-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: LiquidTab 2.0.2（fork：新增小黑盒适配）
          body: |
            ## LiquidTab 2.0.2（Yuxiximyxx fork）

            基于上游 big-dictator/LiquidTab 2.0，本版
            versionName 2.0.2 / versionCode 219。2.0.1 的
            掌上英雄联盟适配保留，正式适配应用 25 → 26 个。

            ### 本版改动

            - **新增小黑盒（com.max.xiaoheihe）适配**：纯配置
              接入（adapters/heybox，GENERIC_FALLBACK），渲染
              走 LiquidTab 共享核心；发现信号来自 BetterHeybox
              液态玻璃底栏的定位成果（主页 MainActivity、底栏
              RadioGroup 资源名 rg_main、中间 tab vg_mid_tab、
              5 槽位），只移植「底栏怎么找、有什么特殊政策」，
              未搬其玻璃绘制代码。TargetSpecRegistry、
              AppCatalog 与 assets/xposed_scope 三处已同步。
            - 其余与 2.0.1 一致，共享渲染核心未改。

            ### 注意

            - **冲突提醒**：启用 LiquidTab 的小黑盒玻璃后，
              请关掉 BetterHeybox（独立版或荣耀工具箱内
              「小黑盒增强」）自带的液态玻璃底栏开关，避免
              同一底栏被处理两次。
            - 小黑盒适配**未经真机验证**：请在 LSPosed 作用域
              勾选小黑盒，强停重开后看底栏是否变为悬浮玻璃。
              若第一版在 1.3.402 上未命中，下一步将出探针版
              定位底栏结构。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
