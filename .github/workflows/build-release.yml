name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.14-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.14-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.14
          name: LiquidTab 2.1.14（fork：反编译掌盟定案——默认软件快照背景）
          body: |
            ## LiquidTab 2.1.14（Yuxiximyxx fork）

            versionName 2.1.14 / versionCode 237。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.13 相同，
            可直接覆盖升级。本版**只动掌盟（qtl）**；小黑盒
            本版不碰。**均为代码层修复，未经真机验证**：

            ### 反编译定案（掌盟 12.10.0，腾讯官方 CDN 同版本包）

            - 【实证】GameHomeActivity（singleTask）布局：
              qt_content（Activity 根）→ HackyDrawerLayout →
              main_container → 底栏装配；条身后方内容区是
              tab_content，页签 fragment 由 wegamex tabview
              装入。模块供给的背景场景就是 qt_content，实时
              场景采样的是它的 RenderNode。
            - 【实证】首页「发现」是原生视图树（标题 tab +
              ViewPager + 原生 RecyclerView feed，无 WebView，
              与真机日志 webView=false 互证）。
            - 【实证】feed 的视频条目含 VideoPlayerView，
              其 video_container（SafeVideoFrameLayout）由
              播放器在条目绑定/起播时程序化挂入**独立合成的
              渲染面**——正是宿主接口注释定性的、父级
              RenderNode 无法可靠采样的那类页面构成。
            - 【推断】冷启约 8 秒 display list 丢失的时点，
              与 feed 数据返回、首批视频条目挂载渲染面吻合；
              触发点本身在日志中不可见，此点为结构推断。

            ### 本版修法（只动 qtl）

            结论：这类页面不该用实时场景、更不该等它退化
            再兜底（2.1.11/2.1.12 自愈、2.1.13 事后落闩均
            未闭环；落闩依赖的帧驱动检测在静态页会随帧流
            枯竭而饿死）。本版起 qtl **默认软件快照背景**：

            - skipLiveBackdrop 恒 true：宿主从第一帧就放行
              实时场景，pre-draw 走软件快照路径，以 qt_content
              为源把条身后方内容画进 backdrop 位图；
              hasUsableBackdrop 经位图条款成立，条身背景与
              display list 彻底脱钩，不存在退化时间窗。
            - 采样新鲜度按美团已验证的同款语义：有待采快照
              （初始/切 tab 后）时请求新采样，落账后只在场
              景内容变化（场景根 isDirty）时重采，静止页面
              不做无谓的全屏软件绘制。
            - 2.1.13 的退化检测/确认落闩整套移除；backdrop
              日志改打 mode=software 与 samplePending。
            - 代价：玻璃背景是静态快照（内容变化时刷新）；
              视频区域在软件绘制下画不出渲染面内容，但条
              身永不黑底。已验好的点击对位、选中映射、内
              容铺底、商城槽位一律未动。

            ### 复验要点

            - 掌盟强停重开：首页与「发现 → 活动」子页各停
              留观察（包括停住不动等十几秒）——底栏应始终
              是有内容的玻璃，不再出现整条黑底；切 tab 流
              畅、高亮对位、药丸颜色一致不回退。
            - 若仍黑：请再导出一次 LSPosed 日志发回，看
              [OfflineGlass][QTL] backdrop 行的
              mode/samplePending 与 snapshot commit 行继
              续定案。
            - 小黑盒本版未动，无需复验。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
