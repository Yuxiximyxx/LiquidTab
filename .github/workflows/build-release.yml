name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.6-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.6-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.6
          name: LiquidTab 2.1.6（fork：掌盟去黑坨+点按身份绑定，小黑盒发布键真独立）
          body: |
            ## LiquidTab 2.1.6（Yuxiximyxx fork）

            versionName 2.1.6 / versionCode 229。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.5 相同，
            可直接覆盖升级。本版修 2.1.5 真机复验的三项问题，
            **均为代码层修复，未经真机验证**：

            ### 1. 掌盟：玻璃条下方还有黑坨

            玻璃条正下方居中露出的黑色半圆，是原中间加号按钮
            （bottom_title_center_btn）的黑色圆形本体。它挂在
            更高层、不在导航源内（源退回文字行本身时），源的
            alpha 隐藏罩不到它，于是透过玻璃条下方露出来。
            本版在 suppress 阶段从窗口根部找到它并置
            INVISIBLE：只停它自身绘制，不动任何布局（界面
            完整红线不变）；捕获、圆钮绘制、点按都直接操作
            视图本体，不受 visibility 影响。

            ### 2. 掌盟：发布槽之后点按偏一位

            真机形态：槽 0/1（首页/好友）正常，槽 3（商城）
            打开「我的」，槽 4（我的）无反应。根因：旧
            dispatch 按序号枚举后在 tab 单元上 performClick
            落空，宿主落回通用兜底路径、按原始下标取文字行
            子视图——文字行里只有四个页面 tab（加号按钮在
            更高层），槽 3 恰好取到第四个 tab（我的），槽 4
            越界。本版改走身份绑定：捕获 artwork 时把每个
            槽位绑到它捕获到的 tab 视图本体（中间槽绑加号
            按钮本体），点按只认绑定，并用三级递进保证送达
            （自身监听 → 内部子视图监听 → 目标中心合成触摸
            交宿主命中分发），不再落回通用路径。顺带修正
            entryLabels 第二项为宿主实际文字「好友」（此前
            推测的「社区」）。

            ### 3. 小黑盒：发布按钮没有真正独立

            真机截图里主条与独立圆钮之间还有粘连：主条的浅色
            底板横跨到圆钮下方。此前 barLayout 照 tieba 开了
            本地光学（localMainOptics/localActionOptics），
            主条采样节点按 padded 全宽输入录制，底板越过主条
            右界伸进间隙。本版按 xhs 适配的口径摘掉这三个
            标志，字段集与 xhs 完全一致：几何不变（主条在
            圆钮前 12dp 收住），两部分走共享外层玻璃路径、
            各自 clip 与阴影分别成形。

            ### 复验要点

            - 掌盟强停重开：玻璃条下方无黑坨；逐个点
              首页/好友/商城/我的，各归其位；中间发布键与
              右侧独立圆钮点按有反应。
            - 小黑盒强停重开：主条与发布圆钮之间有明确
              间隙、两部分分别成形，不再粘连。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
