name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.4-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.4-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.4
          name: LiquidTab 2.1.4（fork：掌盟/小黑盒专属适配 + 微信聊天页底部修复）
          body: |
            ## LiquidTab 2.1.4（Yuxiximyxx fork）

            versionName 2.1.4 / versionCode 227。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.3 相同，
            可直接覆盖升级。本版处理 2.1.3 真机复验的四项问题，
            **均为代码层修复，未经真机验证**：

            ### 1. 掌盟 / 小黑盒去黑背景

            两应用升为专属适配器（QtlAdapter / HeyboxAdapter），
            在 suppress 阶段清掉整个底栏装配的原生底色：掌盟清
            容器、文字行、加号按钮及向上三层底部壳层；小黑盒清
            rg_main 与重叠的阴影薄层，并放开 fl_container 的
            ABOVE 规则让内容铺到屏幕底部，玻璃条直接浮在内容上。

            ### 2. 掌盟 / 小黑盒修按钮偏移

            - 掌盟：源钉死为同时含 tab_title_content 与
              bottom_title_center_btn 的底栏容器；加号按钮不在
              源内时移入容器；中间槽位走 sourceCenter 裁剪
              （美团同款参数）；点按按槽位映射到真实视图转发。
            - 小黑盒：源钉死为 rg_main；把独立于 RadioGroup 的
              加号按钮 vg_mid_tab 移入 rg_main 顶替 rb_3 占位
              并继承其布局参数（重绑时复查，防底栏热更新挂回），
              五个槽位的 artwork/点按/显隐回到同一索引空间。

            ### 3. 掌盟 / 小黑盒接上游现成机制

            复用上游 2.1.2 已有机制，不另造系统：两应用
            defaultDetachedPublish = true 并在适配器实现
            barLayout（tieba/xhs 同款几何），设置页出现
            「独立发布键」开关且默认开启；补 entryLabels
            （掌盟：首页/社区/发布/商城/我的；小黑盒：首页/
            热点/发布/游戏库/我），设置页出现逐项入口开关。
            **其它应用的发布按钮一律未动。** 注意：若 2.1.3
            时已保存过这两应用的单应用配置，独立发布键以已存
            配置为准，可在设置页手动打开。

            ### 4. 微信聊天页底部过高

            根因：模块沉浸使微信窗口 edge-to-edge 后，现行微信
            已自行给 ChatFooter 加了导航条高度的内边距，上游
            WeChatChatInsets 又补了一整份导航高度的底部 padding
            并绘色带，等于重复预留一条。修法（仅动微信适配内
            WeChatChatInsets）：计算附加 padding 时先扣除
            ChatFooter 已自带的底部内边距（其 paddingBottom
            或其下方间隙），不再重复叠加。微信主界面玻璃条
            路径未动。

            ### 复验方法

            - 掌盟：强停重开，首页底栏应无黑带、图标居中；
              设置页（模块内掌盟条目）应有「独立发布键」与
              五个入口开关，发布键默认独立在右。
            - 小黑盒：同上；另注意中间发布键点按应能打开
              发布动作，切换 tab 应正常跟随。
            - 微信：进任意聊天页，输入框下方应只剩正常高度
              （约一条手势区），不再多出一条空黑带；回主界面
              四个 tab 的玻璃条应无变化。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
