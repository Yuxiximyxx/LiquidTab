name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.1.8-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.1.8-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.8
          name: LiquidTab 2.1.8（fork：条带真因=内容未铺底已放开，掌盟卡顿一次性化）
          body: |
            ## LiquidTab 2.1.8（Yuxiximyxx fork）

            versionName 2.1.8 / versionCode 231。基线仍为 upstream
            tag v2.1.2 + fork 适配，证书与 2.0.1–2.1.7 相同，
            可直接覆盖升级。本版修 2.1.7 真机录屏复验的问题，
            **均为代码层修复，未经真机验证**：

            ### 1. 条状背景的真因（掌盟 + 小黑盒，第三次定位）

            先换了方法：把掌盟/小黑盒与仓内呈现干净的微信/xhs
            适配做了完整 diff。结论是这条带子**不是任何一层背景
            没清干净**：微信/xhs 的内容本来就整屏铺底（叠放式
            布局），安装器只需清源与直接父层背景；而掌盟与小黑盒
            的内容是被 RelativeLayout 的 ABOVE 规则顶在底栏
            装配上方的——底栏装配（源 alpha=0、背景已清透）仍以
            原高度留在原层级占位，占位区里没有任何内容，透过去
            看到的是根布局/窗口的主题背景，那就是玻璃条下方的
            全宽色带（浅色白、夜间黑）。间隙里看到的「白色连接」
            也是同一条带在主条与圆钮之间露出，并非两者真有
            连接物；带子去掉、间隙露出真实内容，连接感随之消失。

            前三版为什么没清到：2.1.5–2.1.7 一直在「清哪一层
            背景」上打转，从没动过这条布局约束；2.1.4 其实放开
            过 ABOVE，但因当版整页空白回归（真因是选源命中
            页面级容器，与放开约束无关）被一并回退；小黑盒
            2.1.4 起的放开只摘了 ABOVE 规则、漏了仓内已验证的
            华为健康配方里的第二步——把内容高度设为
            MATCH_PARENT，只摘规则时高度不满高的内容不会自己
            伸到父层底部。

            本版按华为健康配方两步齐做：从源逐层向上，在每个
            RelativeLayout 祖先里，把以 ABOVE 顶在底栏链（或
            底带内锚点）上方、且自身高度占父高四成以上的内容
            视图摘掉 ABOVE 并设高度 MATCH_PARENT，内容真正
            铺到屏幕底部、玻璃条浮在内容上；高度门槛把提示条/
            阴影等小配件排除在外。小黑盒另按 BetterHeybox 当年
            可用实现的口径，按名找到 fl_container 无条件放开，
            不依赖锚点 id 猜对。放开动作只在每个源首次 suppress
            时做一次，结果进缓存、每帧只做复断言（宿主若重设
            内容参数会被立刻改回）。

            ### 2. 掌盟切换卡顿

            宿主在每个 pre-draw 帧都会调用 suppress，旧实现每帧
            重跑多趟遍历：源子树按资源名找文字行/加号按钮两趟、
            从窗口根按资源名找源外加号按钮一趟（全窗 DFS）、
            容器清理的 getLocationInWindow 一组；选中判定又被
            宿主在每个 dispatchDraw 帧调用，旧实现每帧重跑
            「按资源名找文字行 + 四个 tab 子树全量打分（含逐
            视图 drawableState 数组分配）」。本版：suppress 的
            全量解析改为每源只做一次并缓存视图引用，之后每帧
            只对缓存引用做 O(1) 复清；选中判定改走捕获时记录
            的槽位身份绑定（与 artwork/点按同源），只读四个 tab
            本体、isSelected 命中即停，drawable 状态打分只在
            完全没有强信号时才跑。2.1.6/2.1.7 已修好的点击对位
            与选中映射口径不变。

            小黑盒的 suppress 同步做了一次性化（兄弟薄层扫描、
            容器清理、内容放开都进缓存，父层子视图数变化或
            重绑才重解析）；其切换本来就不卡，本版未动其余
            部分，2.1.7 恢复的评论输入框贴合保持不变。

            ### 复验要点

            - 掌盟强停重开：浅色与夜间各看一次，玻璃条下方不再
              有全宽主题色带、内容应铺到屏幕底部，主条与发布
              圆钮的间隙里应是真实内容、不再有白色连接；反复
              切换四个 tab 应流畅不卡，页面与高亮逐一对应，
              发布键点按有反应。
            - 小黑盒强停重开：同样看条下无带、间隙无白色连接；
              评论页拉起键盘时输入区与面板连成整块（2.1.7 项，
              顺带复验即可）。

            ### 注意

            - 冲突提醒：小黑盒请勿与 BetterHeybox 自带液态
              玻璃底栏同时开启（工具箱 v1.10.0 起已移除其
              小黑盒底栏功能，用工具箱版则无此冲突）。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
