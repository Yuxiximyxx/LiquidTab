name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDTAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIQUIDTAB_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidtab-release.keystore"
          ls -lh "$RUNNER_TEMP/liquidtab-release.keystore"

      - name: Build release (unsigned)
        run: |
          chmod +x ./gradlew
          bash ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.LIQUIDTAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIQUIDTAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIQUIDTAB_KEY_PASSWORD }}
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "unsigned apk: $SRC"
          mkdir -p dist
          "$SDK/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/liquidtab-release.keystore" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/LiquidTab-2.0.1-release.apk dist/aligned.apk
          rm dist/aligned.apk
          "$SDK/apksigner" verify --print-certs dist/LiquidTab-2.0.1-release.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidtab-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: LiquidTab 2.0.1（fork：新增掌上英雄联盟适配）
          body: |
            ## LiquidTab 2.0.1（Yuxiximyxx fork）

            基于上游 big-dictator/LiquidTab 2.0（versionCode 217），
            本版 versionName 2.0.1 / versionCode 218。

            ### 本版改动

            - **新增掌上英雄联盟（掌盟，com.tencent.qt.qtl）适配**：
              纯配置接入（adapters/qtl，GENERIC_FALLBACK），走通用
              导航发现；TargetSpecRegistry、AppCatalog 与
              assets/xposed_scope 三处已同步登记，正式适配应用
              24 → 25 个。结构提示来自 PalmPurify 项目对掌盟底栏
              的定位（首页 GameHomeActivity、tab_title_content
              文字行 + bottom_title_center_btn 中间加号、5 槽位）；
              12.10.0 上旧父容器特征已失效，故只作打分提示、
              不写死单一命中条件。
            - 其余与上游 2.0 一致，共享渲染核心未改。

            ### 注意

            - 掌盟适配**未经真机验证**：请在 LSPosed 作用域勾选
              掌上英雄联盟，强停重开掌盟后看底栏是否变为悬浮
              玻璃。若第一版在 12.10.0 上未命中，下一步将出探针
              版定位底栏结构。
            - 本 fork 使用自有签名，与上游原版不能互相覆盖安装。
          files: dist/*.apk
